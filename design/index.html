<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BetterOut — bozze</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#F3ECDF;color:#2A2620}main{max-width:1280px;margin:0 auto;padding:24px 16px}h1{font-size:28px}h2{margin-top:40px;border-bottom:2px solid #2A2620;padding-bottom:6px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}figure{margin:0}img{width:100%;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.2);display:block}figcaption{font-size:14px;margin-top:8px}figcaption b{display:block}figcaption span{color:#6A6155}</style><main><h1>BetterOut — bozze grafiche</h1><p>Direzione visiva B · Rifugio. Dati d’esempio. Tocca un’immagine per ingrandirla.</p><h2>Uscite</h2><div class="g"><figure><a href="bozze/01a-home.png"><img loading="lazy" src="bozze/01a-home.png" alt="Home"></a><figcaption><b>Home</b><span>Prossima uscita, altre uscite, pulsante "+"</span></figcaption></figure><figure><a href="bozze/01b-home-vuota.png"><img loading="lazy" src="bozze/01b-home-vuota.png" alt="Home — stato vuoto"></a><figcaption><b>Home — stato vuoto</b><span>Primo avvio: nessuna uscita</span></figcaption></figure><figure><a href="bozze/01c-home-scuro.png"><img loading="lazy" src="bozze/01c-home-scuro.png" alt="Home — tema scuro"></a><figcaption><b>Home — tema scuro</b><span>Stessa schermata con il tema scuro</span></figcaption></figure><figure><a href="bozze/02a-elenco.png"><img loading="lazy" src="bozze/02a-elenco.png" alt="Elenco uscite"></a><figcaption><b>Elenco uscite</b><span>Tutte le uscite con filtri per stato e ordinamento</span></figcaption></figure><figure><a href="bozze/02b-elenco-filtro-vuoto.png"><img loading="lazy" src="bozze/02b-elenco-filtro-vuoto.png" alt="Elenco uscite — filtro senza risultati"></a><figcaption><b>Elenco uscite — filtro senza risultati</b><span>Un filtro attivo che non trova nulla</span></figcaption></figure><figure><a href="bozze/10a-dettaglio.png"><img loading="lazy" src="bozze/10a-dettaglio.png" alt="Dettaglio uscita"></a><figcaption><b>Dettaglio uscita</b><span>Stato, data, mappa, statistiche, meteo per punto, zaino; azione principale in basso</span></figcaption></figure><figure><a href="bozze/10b-dettaglio-scuro.png"><img loading="lazy" src="bozze/10b-dettaglio-scuro.png" alt="Dettaglio uscita — tema scuro"></a><figcaption><b>Dettaglio uscita — tema scuro</b><span>Stessa schermata con il tema scuro</span></figcaption></figure><figure><a href="bozze/10c-dettaglio-menu.png"><img loading="lazy" src="bozze/10c-dettaglio-menu.png" alt="Dettaglio uscita — altre azioni"></a><figcaption><b>Dettaglio uscita — altre azioni</b><span>Duplicazione, cambio di stato, eliminazione</span></figcaption></figure><figure><a href="bozze/10d-duplica.png"><img loading="lazy" src="bozze/10d-duplica.png" alt="Duplica uscita"></a><figcaption><b>Duplica uscita</b><span>La copia è indipendente: nuova data e spunte azzerate senza toccare l’originale</span></figcaption></figure></div><h2>Creazione e modifica dell’uscita</h2><div class="g"><figure><a href="bozze/03a-nuova-uscita.png"><img loading="lazy" src="bozze/03a-nuova-uscita.png" alt="Nuova uscita — titolo e località"></a><figcaption><b>Nuova uscita — titolo e località</b><span>Primo passo del flusso "+"; la bozza si può salvare in ogni momento</span></figcaption></figure><figure><a href="bozze/03b-modifica-uscita.png"><img loading="lazy" src="bozze/03b-modifica-uscita.png" alt="Modifica uscita"></a><figcaption><b>Modifica uscita</b><span>Tutti i campi in una pagina, raggiungibile dal dettaglio</span></figcaption></figure><figure><a href="bozze/03c-riepilogo.png"><img loading="lazy" src="bozze/03c-riepilogo.png" alt="Nuova uscita — riepilogo"></a><figcaption><b>Nuova uscita — riepilogo</b><span>Ultimo passo: controllo e salvataggio</span></figcaption></figure><figure><a href="bozze/04a-localita.png"><img loading="lazy" src="bozze/04a-localita.png" alt="Ricerca località"></a><figcaption><b>Ricerca località</b><span>Risultati con tipo, quota e regione; alternativa "scegli sulla mappa"</span></figcaption></figure><figure><a href="bozze/04b-localita-errore.png"><img loading="lazy" src="bozze/04b-localita-errore.png" alt="Ricerca località — errore di rete"></a><figcaption><b>Ricerca località — errore di rete</b><span>Senza rete la ricerca fallisce ma l’uscita resta salvabile</span></figcaption></figure><figure><a href="bozze/05-date.png"><img loading="lazy" src="bozze/05-date.png" alt="Date e orari"></a><figcaption><b>Date e orari</b><span>Calendario, ora di partenza, durata, fuso orario della destinazione; "senza data" sempre possibile</span></figcaption></figure><figure><a href="bozze/06-scelta-percorso.png"><img loading="lazy" src="bozze/06-scelta-percorso.png" alt="Percorso — disegna o importa"></a><figcaption><b>Percorso — disegna o importa</b><span>Tre modi per associare un percorso, oppure nessuno</span></figcaption></figure></div><h2>Mappa, percorsi e GPX</h2><div class="g"><figure><a href="bozze/07a-editor-vuoto.png"><img loading="lazy" src="bozze/07a-editor-vuoto.png" alt="Editor percorso — inizio"></a><figcaption><b>Editor percorso — inizio</b><span>Mappa vuota con istruzione; annulla e ripristina non ancora attivi</span></figcaption></figure><figure><a href="bozze/07b-editor-punti.png"><img loading="lazy" src="bozze/07b-editor-punti.png" alt="Editor percorso — segui sentieri"></a><figcaption><b>Editor percorso — segui sentieri</b><span>Punti collegati lungo i sentieri; statistiche aggiornate a ogni punto</span></figcaption></figure><figure><a href="bozze/07c-editor-selezione.png"><img loading="lazy" src="bozze/07c-editor-selezione.png" alt="Editor percorso — punto selezionato"></a><figcaption><b>Editor percorso — punto selezionato</b><span>Trascinare sposta il punto; il riquadro offre inserimento ed eliminazione anche senza gesti</span></figcaption></figure><figure><a href="bozze/07d-editor-manuale.png"><img loading="lazy" src="bozze/07d-editor-manuale.png" alt="Editor percorso — tratto manuale"></a><figcaption><b>Editor percorso — tratto manuale</b><span>Il tratto manuale è tratteggiato e dichiarato non verificato</span></figcaption></figure><figure><a href="bozze/07e-editor-errore.png"><img loading="lazy" src="bozze/07e-editor-errore.png" alt="Editor percorso — routing non riuscito"></a><figcaption><b>Editor percorso — routing non riuscito</b><span>L’errore è esplicito e la scelta resta all’utente: nessuna linea retta messa di nascosto</span></figcaption></figure><figure><a href="bozze/08a-gpx-anteprima.png"><img loading="lazy" src="bozze/08a-gpx-anteprima.png" alt="Importazione GPX — anteprima"></a><figcaption><b>Importazione GPX — anteprima</b><span>File letto correttamente: mappa, statistiche e azioni</span></figcaption></figure><figure><a href="bozze/08b-gpx-avvisi.png"><img loading="lazy" src="bozze/08b-gpx-avvisi.png" alt="Importazione GPX — più tracciati, segmenti, quote assenti"></a><figcaption><b>Importazione GPX — più tracciati, segmenti, quote assenti</b><span>I casi particolari sono dichiarati; i segmenti non vengono uniti</span></figcaption></figure><figure><a href="bozze/08c-gpx-errore.png"><img loading="lazy" src="bozze/08c-gpx-errore.png" alt="Importazione GPX — file non valido"></a><figcaption><b>Importazione GPX — file non valido</b><span>Errore spiegato; nulla viene salvato</span></figcaption></figure><figure><a href="bozze/08d-gpx-lettura.png"><img loading="lazy" src="bozze/08d-gpx-lettura.png" alt="Importazione GPX — lettura in corso"></a><figcaption><b>Importazione GPX — lettura in corso</b><span>File grande: avanzamento visibile, annullabile</span></figcaption></figure><figure><a href="bozze/09-percorso.png"><img loading="lazy" src="bozze/09-percorso.png" alt="Dettaglio percorso"></a><figcaption><b>Dettaglio percorso</b><span>Statistiche, profilo altimetrico, origine del percorso e uscite che lo usano</span></figcaption></figure><figure><a href="bozze/17a-mappa.png"><img loading="lazy" src="bozze/17a-mappa.png" alt="Mappa"></a><figcaption><b>Mappa</b><span>Scheda Mappa: cartografia escursionistica, strati, posizione, nuovo percorso</span></figcaption></figure><figure><a href="bozze/17b-archivio-percorsi.png"><img loading="lazy" src="bozze/17b-archivio-percorsi.png" alt="Archivio percorsi"></a><figcaption><b>Archivio percorsi</b><span>Percorsi salvati con origine, statistiche e stato dei dati</span></figcaption></figure><figure><a href="bozze/17c-strati-offline.png"><img loading="lazy" src="bozze/17c-strati-offline.png" alt="Mappa — strati e mappe offline"></a><figcaption><b>Mappa — strati e mappe offline</b><span>Scelta dello sfondo e scaricamento esplicito di un’area con dimensione e rimozione</span></figcaption></figure></div><h2>Meteo</h2><div class="g"><figure><a href="bozze/11a-meteo-giorno.png"><img loading="lazy" src="bozze/11a-meteo-giorno.png" alt="Meteo giornaliero"></a><figcaption><b>Meteo giornaliero</b><span>Previsione per punto e quota, con fonte e ora di aggiornamento</span></figcaption></figure><figure><a href="bozze/11b-meteo-ore.png"><img loading="lazy" src="bozze/11b-meteo-ore.png" alt="Meteo orario"></a><figcaption><b>Meteo orario</b><span>Ora per ora nella giornata dell’uscita, con vento e raffiche</span></figcaption></figure><figure><a href="bozze/11c-meteo-non-disponibile.png"><img loading="lazy" src="bozze/11c-meteo-non-disponibile.png" alt="Meteo — previsioni non ancora disponibili"></a><figcaption><b>Meteo — previsioni non ancora disponibili</b><span>Data oltre l’orizzonte: nessun dato inventato; il clima del periodo è separato e dichiarato</span></figcaption></figure><figure><a href="bozze/11d-meteo-offline.png"><img loading="lazy" src="bozze/11d-meteo-offline.png" alt="Meteo — senza rete e caricamento"></a><figcaption><b>Meteo — senza rete e caricamento</b><span>Offline si vede l’ultimo dato con la sua età; l’errore non blocca nulla</span></figcaption></figure></div><h2>Preparazione, suggerimenti e checklist</h2><div class="g"><figure><a href="bozze/12a-preparazione-percorso.png"><img loading="lazy" src="bozze/12a-preparazione-percorso.png" alt="Preparazione guidata — percorso e date"></a><figcaption><b>Preparazione guidata — percorso e date</b><span>Passo 1: da dove arrivano i dati; si può preparare anche senza percorso</span></figcaption></figure><figure><a href="bozze/12b-preparazione-ritmo.png"><img loading="lazy" src="bozze/12b-preparazione-ritmo.png" alt="Preparazione guidata — ritmo, notti, acqua"></a><figcaption><b>Preparazione guidata — ritmo, notti, acqua</b><span>Passo 2: la stima si aggiorna a ogni scelta ed è correggibile a mano</span></figcaption></figure><figure><a href="bozze/13a-suggerimenti.png"><img loading="lazy" src="bozze/13a-suggerimenti.png" alt="Suggerimenti attrezzatura — da decidere"></a><figcaption><b>Suggerimenti attrezzatura — da decidere</b><span>Ogni voce ha il suo motivo; si distinguono mancanti, disponibili in inventario e alternative</span></figcaption></figure><figure><a href="bozze/13b-suggerimenti-volume.png"><img loading="lazy" src="bozze/13b-suggerimenti-volume.png" alt="Suggerimenti — volume, peso e avvertenza"></a><figcaption><b>Suggerimenti — volume, peso e avvertenza</b><span>Volume stimato rispetto allo zaino, con i dati mancanti in evidenza</span></figcaption></figure><figure><a href="bozze/13c-suggerimenti-alternative.png"><img loading="lazy" src="bozze/13c-suggerimenti-alternative.png" alt="Suggerimenti — alternative per la stessa funzione"></a><figcaption><b>Suggerimenti — alternative per la stessa funzione</b><span>Più oggetti dell’inventario con lo stesso uso: si sceglie quale portare</span></figcaption></figure><figure><a href="bozze/14a-checklist.png"><img loading="lazy" src="bozze/14a-checklist.png" alt="Checklist zaino"></a><figcaption><b>Checklist zaino</b><span>Avanzamento, pesi per tipo, oggetti per categoria con subtotale, quantità e spunte</span></figcaption></figure><figure><a href="bozze/14b-checklist-riga.png"><img loading="lazy" src="bozze/14b-checklist-riga.png" alt="Checklist — dettaglio di una riga"></a><figcaption><b>Checklist — dettaglio di una riga</b><span>Quantità, tipo e nota valgono solo per questa uscita; l’inventario non cambia</span></figcaption></figure><figure><a href="bozze/14c-checklist-aggiungi.png"><img loading="lazy" src="bozze/14c-checklist-aggiungi.png" alt="Checklist — aggiungi dall’inventario"></a><figcaption><b>Checklist — aggiungi dall’inventario</b><span>Ricerca e selezione multipla; ciò che è già nello zaino è indicato</span></figcaption></figure><figure><a href="bozze/14d-checklist-completa.png"><img loading="lazy" src="bozze/14d-checklist-completa.png" alt="Checklist — tutto pronto e menu"></a><figcaption><b>Checklist — tutto pronto e menu</b><span>Stato completo dichiarato a parole; azzera spunte ed esporta CSV dal menu</span></figcaption></figure></div><h2>Attrezzatura</h2><div class="g"><figure><a href="bozze/15a-inventario.png"><img loading="lazy" src="bozze/15a-inventario.png" alt="Inventario attrezzatura"></a><figcaption><b>Inventario attrezzatura</b><span>Ricerca, filtri per categoria, peso e tipo di ogni oggetto, stime riconoscibili</span></figcaption></figure><figure><a href="bozze/15b-inventario-vuoto.png"><img loading="lazy" src="bozze/15b-inventario-vuoto.png" alt="Inventario — stato vuoto"></a><figcaption><b>Inventario — stato vuoto</b><span>Inventario vuoto con catalogo iniziale facoltativo</span></figcaption></figure><figure><a href="bozze/16a-oggetto.png"><img loading="lazy" src="bozze/16a-oggetto.png" alt="Modifica oggetto"></a><figcaption><b>Modifica oggetto</b><span>Nome, peso, volume, categoria, tipo, uso, note</span></figcaption></figure><figure><a href="bozze/16b-oggetto-errore.png"><img loading="lazy" src="bozze/16b-oggetto-errore.png" alt="Nuovo oggetto — campo mancante"></a><figcaption><b>Nuovo oggetto — campo mancante</b><span>L’errore è scritto accanto al campo, non solo colorato</span></figcaption></figure><figure><a href="bozze/16c-oggetto-zaino.png"><img loading="lazy" src="bozze/16c-oggetto-zaino.png" alt="Nuovo oggetto — zaino e categorie"></a><figcaption><b>Nuovo oggetto — zaino e categorie</b><span>Per gli zaini compare la capacità; le categorie si possono aggiungere</span></figcaption></figure></div><h2>Impostazioni, backup ed esportazioni</h2><div class="g"><figure><a href="bozze/18-impostazioni.png"><img loading="lazy" src="bozze/18-impostazioni.png" alt="Impostazioni"></a><figcaption><b>Impostazioni</b><span>Lingua, tema, unità, soglia del dislivello e accesso alle sezioni di servizio</span></figcaption></figure><figure><a href="bozze/18b-servizi.png"><img loading="lazy" src="bozze/18b-servizi.png" alt="Impostazioni — stato di dati e servizi"></a><figcaption><b>Impostazioni — stato di dati e servizi</b><span>Cosa funziona senza rete, quali servizi rispondono, cache e chiavi facoltative</span></figcaption></figure><figure><a href="bozze/19a-backup.png"><img loading="lazy" src="bozze/19a-backup.png" alt="Backup, ripristino ed esportazioni"></a><figcaption><b>Backup, ripristino ed esportazioni</b><span>Backup completo JSON, ripristino da file, CSV e GPX, condivisione</span></figcaption></figure><figure><a href="bozze/19b-ripristino.png"><img loading="lazy" src="bozze/19b-ripristino.png" alt="Ripristino — anteprima e scelta"></a><figcaption><b>Ripristino — anteprima e scelta</b><span>Validazione, conteggi, unione o sostituzione; prima di sostituire si salva un backup di sicurezza</span></figcaption></figure><figure><a href="bozze/19c-ripristino-errore.png"><img loading="lazy" src="bozze/19c-ripristino-errore.png" alt="Ripristino — file non valido"></a><figcaption><b>Ripristino — file non valido</b><span>Il file viene rifiutato prima di toccare i dati</span></figcaption></figure></div><h2>Dialoghi</h2><div class="g"><figure><a href="bozze/20a-elimina-uscita.png"><img loading="lazy" src="bozze/20a-elimina-uscita.png" alt="Dialogo — eliminare un’uscita"></a><figcaption><b>Dialogo — eliminare un’uscita</b><span>Conferma con il nome e con ciò che viene (e non viene) eliminato</span></figcaption></figure><figure><a href="bozze/20b-modifiche-non-salvate.png"><img loading="lazy" src="bozze/20b-modifiche-non-salvate.png" alt="Dialogo — modifiche non salvate"></a><figcaption><b>Dialogo — modifiche non salvate</b><span>Tre uscite chiare: salvare come bozza, scartare, restare</span></figcaption></figure><figure><a href="bozze/20c-permesso-posizione.png"><img loading="lazy" src="bozze/20c-permesso-posizione.png" alt="Dialogo — permesso di posizione"></a><figcaption><b>Dialogo — permesso di posizione</b><span>Spiegazione prima della richiesta di sistema; rifiutare non blocca nulla</span></figcaption></figure><figure><a href="bozze/20d-elimina-oggetto.png"><img loading="lazy" src="bozze/20d-elimina-oggetto.png" alt="Dialogo — eliminare un oggetto dell’inventario"></a><figcaption><b>Dialogo — eliminare un oggetto dell’inventario</b><span>La regola è dichiarata: checklist e storico restano</span></figcaption></figure><figure><a href="bozze/20e-azzera-spunte.png"><img loading="lazy" src="bozze/20e-azzera-spunte.png" alt="Dialogo — azzerare le spunte"></a><figcaption><b>Dialogo — azzerare le spunte</b><span>Azione reversibile solo a mano: conferma breve</span></figcaption></figure><figure><a href="bozze/20f-percorso-in-uso.png"><img loading="lazy" src="bozze/20f-percorso-in-uso.png" alt="Dialogo — modificare un percorso in uso"></a><figcaption><b>Dialogo — modificare un percorso in uso</b><span>Avviso quando il percorso è associato a più uscite</span></figcaption></figure></div></main></html>
