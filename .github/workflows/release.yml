name: Rilascio

# Un tag "v0.2.0" pubblica una Release con gli APK firmati, uno per architettura.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Versione dal tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test e verifiche
        run: ./gradlew testDebugUnitTest lintDebug -Pbetterout.version="$VERSION"
      - name: Chiave di firma dai secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.BETTEROUT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Manca il secret BETTEROUT_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/betterout-release.jks"
      - name: APK release firmati
        env:
          BETTEROUT_KEYSTORE_FILE: ${{ runner.temp }}/betterout-release.jks
          BETTEROUT_KEYSTORE_PASSWORD: ${{ secrets.BETTEROUT_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Pbetterout.version="$VERSION"
      - name: Controlla la firma e rinomina
        run: |
          mkdir dist
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --print-certs "$apk" | grep "SHA-256"
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/BetterOut-$VERSION-$abi.apk"
          done
          ls -la dist
      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "BetterOut $VERSION" --generate-notes \
            --notes "Versione di prova. Quasi tutti i telefoni usano il file **arm64-v8a**; armeabi-v7a è per telefoni vecchi a 32 bit, x86_64 per emulatori."
